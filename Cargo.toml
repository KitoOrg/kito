[workspace]
resolver = "2"
members = ["crates/kito-core", "crates/kito-store", "crates/kito-parse", "crates/kito-diff", "crates/kito-merge", "crates/kito-lane", "crates/kito-integrate", "crates/kito-git", "crates/kitod", "crates/kito-cli", "crates/kito-mcp"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kito-core = { path = "crates/kito-core" }
kito-store = { path = "crates/kito-store" }
kito-parse = { path = "crates/kito-parse" }
kito-diff = { path = "crates/kito-diff" }
kito-merge = { path = "crates/kito-merge" }
kito-lane = { path = "crates/kito-lane" }
kito-integrate = { path = "crates/kito-integrate" }
kito-git = { path = "crates/kito-git" }
kitod = { path = "crates/kitod" }

blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
gix = { version = "0.90", default-features = false, features = ["sha1", "index"] }
ignore = "0.4"
memmap2 = "0.9"
notify = "8"
redb = "4"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
similar = "3"
serde_json = "1"
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
rustix = { version = "1", features = ["process"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
toml = "0.9"
toml_edit = "0.23"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
zstd = "0.13"

# test / bench
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

# Dependencies are built without debug information: the grammars and gix
# alone add gigabytes to target/ and minutes to every link.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = 1

[profile.bench]
debug = 1
