[workspace]
resolver = "2"
members = ["crates/kito-core", "crates/kito-store", "crates/kito-parse", "crates/kito-diff", "crates/kito-merge", "crates/kito-semantic", "crates/kito-lane", "crates/kito-integrate", "crates/kito-git", "crates/kitod", "crates/kito-cli", "crates/kito-mcp", "crates/kito-server"]

[workspace.package]
version = "0.29.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kito-core = { path = "crates/kito-core" }
kito-store = { path = "crates/kito-store" }
kito-parse = { path = "crates/kito-parse" }
kito-diff = { path = "crates/kito-diff" }
kito-merge = { path = "crates/kito-merge" }
kito-lane = { path = "crates/kito-lane" }
kito-semantic = { path = "crates/kito-semantic" }
kito-integrate = { path = "crates/kito-integrate" }
kito-git = { path = "crates/kito-git" }
kitod = { path = "crates/kitod" }

blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
gix = { version = "0.90", default-features = false, features = ["sha1", "index"] }
ignore = "0.4"
memmap2 = "0.9"
notify = "8"
prost = "0.14"
redb = "4"
reflink-copy = "0.1"
imbl = { version = "7", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
similar = "3"
serde_json = "1"
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "process"] }
rustix = { version = "1", features = ["process"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
toml = "0.9"
toml_edit = "0.23"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
zstd = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
webpki-roots = "1"
sha2 = "0.11"
landlock = "0.4"

# test / bench
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

# Test binaries are many and each links everything: with full debug
# information and incremental caches `target/` passes 20 GB.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Dependencies are built without debug information: the grammars and gix
# alone add gigabytes to target/ and minutes to every link.
[profile.dev.package."*"]
debug = false

[profile.release]
debug = 1

# The archives of a release: what is measured with `release`, without the
# debug information, which made the Linux binaries ten times larger.
[profile.dist]
inherits = "release"
debug = false
strip = true

[profile.bench]
debug = 1
