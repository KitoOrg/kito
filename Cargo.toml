[workspace]
resolver = "2"
members = ["crates/kito-core", "crates/kito-store", "crates/kito-diff", "crates/kito-git", "crates/kitod", "crates/kito-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
kito-core = { path = "crates/kito-core" }
kito-store = { path = "crates/kito-store" }
kito-diff = { path = "crates/kito-diff" }
kito-git = { path = "crates/kito-git" }
kitod = { path = "crates/kitod" }

blake3 = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
gix = { version = "0.90", default-features = false, features = ["sha1", "index"] }
ignore = "0.4"
memmap2 = "0.9"
notify = "8"
redb = "4"
serde = { version = "1", features = ["derive"] }
similar = "3"
serde_json = "1"
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
toml = "0.9"
zstd = "0.13"

# test / bench
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
debug = 1

[profile.bench]
debug = 1
