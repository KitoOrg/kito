[package]
name = "kitod"
description = "Kito: per-repository daemon (watcher, capture, JSON-RPC socket)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kitod"
path = "src/lib.rs"

[[bin]]
name = "kitod"
path = "src/main.rs"

[dependencies]
kito-core.workspace = true
kito-store.workspace = true
kito-diff.workspace = true
kito-merge.workspace = true
kito-semantic.workspace = true
kito-lane.workspace = true
kito-integrate.workspace = true
kito-parse.workspace = true
kito-git.workspace = true
ignore.workspace = true
notify.workspace = true
serde.workspace = true
similar.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
sha2.workspace = true
rustix.workspace = true
getrandom = "0.2"
# The registry of plugins (ADR 0008): read over HTTPS, archives unpacked.
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
# The registry's signatures (ADR 0009): the library rustls already brings.
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(windows)'.dependencies]
junction = "1"
tokio-util = { version = "0.7", features = ["io-util"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
