name: Windows

# The port to Windows (ADR 0002), while it is under way: the build and the
# tests on Windows. Run by hand; it joins CI once they pass.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked --no-fail-fast
