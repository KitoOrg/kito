name: Windows

# The port to Windows (ADR 0002), while it is under way: the build and the
# tests on Windows. Run by hand; it joins CI once they pass.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    # A test that hangs is not waited for for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Checks run through `sh` where there is one: Git for Windows has it.
      - run: echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked --no-fail-fast -- --test-threads 4
