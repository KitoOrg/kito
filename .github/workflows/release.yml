name: Release

# A tag `v0.16.0` builds the four programs for each platform, packs them
# with a SHA-256 checksum, and publishes a GitHub Release whose notes are
# that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner: the binaries run on older glibc too.
          - { platform: linux-x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build
        run: cargo build --release --locked -p kitod -p kito-cli -p kito-mcp -p kito-server
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kito-${version}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          for bin in kito kitod kito-mcp kito-server; do cp "target/release/$bin" "dist/$name/"; done
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Kito $version" > notes.md
          cat dist/*.sha256 > dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS install.sh \
            --title "Kito ${GITHUB_REF_NAME#v}" --notes-file notes.md
