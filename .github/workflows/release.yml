name: Release

# A tag `v0.16.0` builds the four programs for each platform, packs them
# with a SHA-256 checksum, and publishes a GitHub Release whose notes are
# that version's section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner: the binaries run on older glibc too.
          - { platform: linux-x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { platform: macos-arm64, target: aarch64-apple-darwin, runner: macos-15 }
          - { platform: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15-intel }
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # `dist`: the release profile without debug information, stripped.
      - name: Build
        run: cargo build --profile dist --locked -p kitod -p kito-cli -p kito-mcp -p kito-server
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kito-${version}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            # A zip, with `.exe`: what Windows opens by itself.
            for bin in kito kitod kito-mcp kito-server; do cp "../target/dist/$bin.exe" "$name/"; done
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "$(sha256sum "$name.zip" | cut -d' ' -f1)  $name.zip" > "$name.zip.sha256"
          else
            for bin in kito kitod kito-mcp kito-server; do cp "../target/dist/$bin" "$name/"; done
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Kito $version" > notes.md
          cat dist/*.sha256 > dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
            install.sh install.ps1 \
            --title "Kito ${GITHUB_REF_NAME#v}" --notes-file notes.md
