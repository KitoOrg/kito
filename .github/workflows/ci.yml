name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # La demo della fase 0 in formato ridotto: 100.000 op con kill -9.
      - run: cargo run --release -p kito-store --example crash_demo -- driver --dir "$RUNNER_TEMP/kito-demo" --ops 100000

  bench:
    # Soglia di regressione del 10% rispetto al ramo di destinazione.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark del ramo di destinazione
        run: |
          git checkout --quiet "origin/${{ github.base_ref }}"
          cargo bench --workspace -- --save-baseline base
      - name: Benchmark della pull request
        run: |
          git checkout --quiet "${{ github.sha }}"
          cargo bench --workspace -- --baseline base
      - run: python3 scripts/bench_check.py --threshold 0.10
