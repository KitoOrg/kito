name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Each platform's answer, even when the other fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs is not waited for for hours.
    timeout-minutes: 60
    defaults:
      run:
        # On Windows too: Git's bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Checks run through `sh` where there is one: Git for Windows has it
      # (ADR 0002).
      - if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-analyzer: one test drives the real one.
          components: rustfmt, clippy, rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every failure, not only the first crate's. Fewer at a time on
      # Windows, where starting a process costs more.
      - run: cargo test --workspace --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads 4' || '' }} < /dev/null
      # The phase 0 demo in reduced form: 100,000 ops with kill -9.
      - if: runner.os != 'Windows'
        run: cargo run --release -p kito-store --example crash_demo -- driver --dir "$RUNNER_TEMP/kito-demo" --ops 100000
      # The phase 3 demo in reduced form: a swarm through the real daemon.
      - if: runner.os != 'Windows'
        run: |
          cargo build --release -p kitod
          cargo run --release -p kitod --example swarm -- --agents 6 --rounds 3

  bench:
    # Regression threshold of 10% relative to the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Benchmark the base branch
        run: |
          git checkout --quiet "origin/${{ github.base_ref }}"
          cargo bench --workspace -- --save-baseline base
      - name: Benchmark the pull request
        run: |
          git checkout --quiet "${{ github.sha }}"
          cargo bench --workspace -- --baseline base
      - run: python3 scripts/bench_check.py --threshold 0.10
